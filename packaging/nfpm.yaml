# Debian-Paket für den Raspberry Pi (arch: all, benötigt Node.js >= 22)
name: evcc-addons
arch: all
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Matthias Gasser <matthias@gassermail.de>
description: |
  Reverse proxy in front of evcc that extends the evcc web UI with installable
  addons (menu entry "Addons", addon API, consumers addon).
license: MIT

depends:
  - nodejs (>= 22)

contents:
  - src: dist/package/opt/
    dst: /opt/evcc-addons/
    type: tree
  # Lizenz und Fremdlizenzen (MIT, Apache-2.0) wie bei Debian üblich unter /usr/share/doc
  - src: LICENSE
    dst: /usr/share/doc/evcc-addons/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/evcc-addons/THIRD_PARTY_NOTICES.md
  - src: packaging/evcc-addons.service
    dst: /usr/lib/systemd/system/evcc-addons.service
  - src: packaging/config.json
    dst: /etc/evcc-addons/config.json
    type: config|noreplace

scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
